{% extends "base.html" %}

{% block title %}
Edit Supplier | StoreLedger
{% endblock %}

{% block page_title %}
Edit Supplier
{% endblock %}

{% block content %}

<div class="form-card">

    <form method="POST">

        <div class="form-group">
            <label>Supplier Name</label>

            <input
                type="text"
                name="supplier_name"
                value="{{ supplier.supplier_name }}"
                required
            >
        </div>

        <div class="form-group">
            <label>Company Name</label>

            <input
                type="text"
                name="company_name"
                value="{{ supplier.company_name or '' }}"
            >
        </div>

        <div class="form-group">
            <label>Phone</label>

            <input
                type="text"
                name="phone"
                value="{{ supplier.phone or '' }}"
            >
        </div>

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ supplier.email or '' }}"
            >
        </div>

        <div class="form-group">
            <label>Address</label>

            <input
                type="text"
                name="address"
                value="{{ supplier.address or '' }}"
            >
        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Update Supplier
            </button>

            <a
                href="{{ url_for('suppliers') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
