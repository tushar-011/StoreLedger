{% extends "base.html" %}

{% block title %}
Add Category | StoreLedger
{% endblock %}

{% block page_title %}
Add Category
{% endblock %}

{% block content %}

<div class="form-card">

    {% if error %}

    <div class="error-message">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label>
                Category Name
            </label>

            <input
                type="text"
                name="category_name"
                placeholder="Enter category name"
                required
            >

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Add Category
            </button>

            <a
                href="{{ url_for('category_list') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
