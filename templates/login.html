<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | StoreLedger
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <h1>
                StoreLedger
            </h1>

            <p>
                Billing & Inventory Management
            </p>

            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                        autofocus
                    >

                </div>

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-button login-button"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</body>

</html>
