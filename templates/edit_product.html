{% extends "base.html" %}

{% block title %}
Edit Product | StoreLedger
{% endblock %}

{% block page_title %}
Edit Product
{% endblock %}

{% block content %}

<div class="form-card">

    <form method="POST">

        <div class="form-group">
            <label>Product Name</label>

            <input
                type="text"
                name="product_name"
                value="{{ product.product_name }}"
                required
            >
        </div>


        <div class="form-group">
            <label>Category</label>

            <select name="category_id">

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}

                <option
                    value="{{ category.category_id }}"
                    {% if category.category_id == product.category_id %}
                        selected
                    {% endif %}
                >
                    {{ category.category_name }}
                </option>

                {% endfor %}

            </select>
        </div>


        <div class="form-group">
            <label>Supplier</label>

            <select name="supplier_id" required>

                <option
                    value=""
                    disabled
                    {% if not product.supplier_id %}
                        selected
                    {% endif %}
                >
                    Select Supplier
                </option>

                {% for supplier in suppliers %}

                <option
                    value="{{ supplier.supplier_id }}"
                    {% if supplier.supplier_id == product.supplier_id %}
                        selected
                    {% endif %}
                >
                    {{ supplier.supplier_name }}
                </option>

                {% endfor %}

            </select>
        </div>


        <div class="form-group">
            <label>Price</label>

            <input
                type="number"
                name="price"
                step="0.01"
                min="0"
                value="{{ product.price }}"
                required
            >
        </div>


        <div class="form-group">
            <label>Stock</label>

            <input
                type="number"
                name="stock"
                min="0"
                value="{{ product.stock }}"
                required
            >
        </div>


        <div class="form-group">
            <label>Minimum Stock</label>

            <input
                type="number"
                name="minimum_stock"
                min="0"
                value="{{ product.minimum_stock }}"
                required
            >
        </div>


        <div class="form-group">
            <label>Tax Rate (%)</label>

            <input
                type="number"
                name="tax_rate"
                step="0.01"
                min="0"
                value="{{ product.tax_rate }}"
            >
        </div>


        <div class="form-group">
            <label>Expiry Date</label>

            <input
                type="date"
                name="expiry_date"
                value="{{ product.expiry_date or '' }}"
            >
        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Update Product
            </button>

            <a
                href="{{ url_for('products') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
