{% extends "base.html" %}

{% block title %}
Add Supplier | StoreLedger
{% endblock %}

{% block page_title %}
Add Supplier
{% endblock %}

{% block content %}

<div class="form-card">

    <form method="POST">

        <div class="form-group">
            <label>Supplier Name</label>

            <input
                type="text"
                name="supplier_name"
                required
            >
        </div>

        <div class="form-group">
            <label>Company Name</label>

            <input
                type="text"
                name="company_name"
            >
        </div>

        <div class="form-group">
            <label>Phone</label>

            <input
                type="text"
                name="phone"
            >
        </div>

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                name="email"
            >
        </div>

        <div class="form-group">
            <label>Address</label>

            <input
                type="text"
                name="address"
            >
        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Save Supplier
            </button>

            <a
                href="{{ url_for('suppliers') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
